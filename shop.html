<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop | Basil Mark</title>
  <meta name="description" content="Basil Mark: men's leather belts, wallets and cufflinks.">
  <meta name="theme-color" content="#24392e">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="site-header" class="site-header"></div>
  <main class="wrap">
    <header class="page-head">
      <h1 id="shop-title">The collection</h1>
      <p id="shop-desc">Every piece in the Basil Mark range.</p>
    </header>
    <div class="toolbar">
      <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
      <label class="sort">Sort by
        <select id="sort">
          <option value="featured">Featured</option>
          <option value="new">Newest</option>
          <option value="price-asc">Price, low to high</option>
          <option value="price-desc">Price, high to low</option>
        </select>
      </label>
    </div>
    <p class="result-count" id="count" aria-live="polite"></p>
    <div class="grid" id="grid" style="padding-bottom:5rem"></div>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script type="module" src="assets/js/pages/shop.js"></script>
</body>
</html>
